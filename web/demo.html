<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>상담 위젯 설치 미리보기</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      body {
        background: #fff;
      }
      .demo-head {
        padding: 28px 8vw;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .demo-body {
        max-width: 1050px;
        margin: 90px auto;
        padding: 0 30px;
      }
      .demo-body h1 {
        font-size: 48px;
        max-width: 700px;
        line-height: 1.5;
      }
      .demo-body p {
        max-width: 540px;
        font-size: 17px;
        color: #60758e;
      }
      .demo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        margin-top: 65px;
      }
      .demo-grid article {
        border-top: 3px solid #b7c9e9;
        padding-top: 20px;
      }
      .demo-note {
        background: #edf3fc;
        color: #425d85;
        padding: 14px 8vw;
        font-size: 12px;
      }
      @media (max-width: 650px) {
        .demo-body {
          margin-top: 55px;
        }
        .demo-body h1 {
          font-size: 32px;
        }
        .demo-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-note">
      설치 미리보기입니다. 오른쪽 아래의 위젯은 실제 게시 설정과 연결 상태를
      사용합니다.
    </div>
    <header class="demo-head">
      <span class="brand">당신의 홈페이지</span
      ><a href="/">상담 관리로 돌아가기</a>
    </header>
    <section class="demo-body">
      <h1>질문이 떠오르는 순간,<br />대화를 시작하세요.</h1>
      <p>
        방문자가 홈페이지를 떠나지 않고 서비스에 대해 물어볼 수 있습니다. 상담
        버튼을 눌러 직접 확인해 보세요.
      </p>
      <div class="demo-grid">
        <article>
          <h3>서비스 소개</h3>
          <p>고객이 궁금해하는 정보를 안내합니다.</p>
        </article>
        <article>
          <h3>자주 묻는 질문</h3>
          <p>등록한 자료를 바탕으로 대화합니다.</p>
        </article>
        <article>
          <h3>상담 문의</h3>
          <p>담당자에게 연락처와 문의를 남깁니다.</p>
        </article>
      </div>
    </section>
    <script src="/demo.js"></script>
  </body>
</html>
