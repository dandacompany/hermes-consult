<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="frameTitle">AI consultation</title>
    <link rel="stylesheet" href="/frame.css" />
  </head>
  <body>
    <header>
      <div>
        <strong id="name" data-i18n="assistant">AI assistant</strong
        ><span id="status" data-i18n="checking">Checking connection</span>
      </div>
      <button id="close" data-i18n-aria-label="close" aria-label="Close consultation window">×</button>
    </header>
    <main>
      <section id="welcome">
        <div class="voice-symbol" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <h1 data-i18n="welcome">Ask anything.</h1>
        <p id="greeting"></p>
        <button id="start" class="primary" data-i18n="startVoice">Start voice consultation</button>
        <p class="small" data-i18n="aiNotice">
          Answers are generated by AI. Microphone access is required.
        </p>
      </section>
      <div id="messages" role="log" aria-live="polite"></div>
      <p id="error" role="alert"></p>
    </main>
    <section id="controls" hidden>
      <span id="clock"></span><button id="mute" data-i18n="muteOff">Mute microphone</button
      ><button id="end" data-i18n="endCall">End consultation</button>
    </section>
    <footer>
      <form id="text-form">
        <input
          id="text"
          aria-label="Question"
          data-i18n-aria-label="question"
          maxlength="4000"
          placeholder="You can also type your question"
          data-i18n-placeholder="textPlaceholder"
          required
        /><button
          type="submit"
          aria-label="Send question"
          data-i18n-aria-label="sendQuestion"
          data-i18n="send"
        >
          Send
        </button>
      </form>
      <button id="lead-toggle" class="text-button" data-i18n="leadToggle">
        Leave a message for staff
      </button>
      <form id="lead-form" hidden>
        <label
          ><span data-i18n="leadName">Name</span
          ><input name="name" required maxlength="100" /></label
        ><label
          ><span data-i18n="leadContact">Contact</span
          ><input
            name="contact"
            required
            maxlength="200"
            placeholder="Email or phone number"
            data-i18n-placeholder="leadContactPlaceholder" /></label
        ><label
          ><span data-i18n="leadMessage">Message</span
          ><textarea name="message" maxlength="2000" rows="2"></textarea></label
        ><label class="consent"
          ><input name="consent" type="checkbox" required /><span
            data-i18n="leadConsent"
            >I agree that my name, contact details and message are sent to this
            website’s consultation provider and kept for 30 days to answer my
            inquiry.</span
          ></label
        ><button type="submit" class="primary" data-i18n="leadSubmit">
          Send inquiry
        </button>
      </form>
    </footer>
    <script type="module" src="/frame.js"></script>
  </body>
</html>
