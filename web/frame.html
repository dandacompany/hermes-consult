<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI 상담</title>
    <link rel="stylesheet" href="/frame.css" />
  </head>
  <body>
    <header>
      <div>
        <strong id="name">AI 상담원</strong
        ><span id="status">연결 확인 중</span>
      </div>
      <button id="close" aria-label="상담 창 닫기">×</button>
    </header>
    <main>
      <section id="welcome">
        <div class="voice-symbol" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <h1>편하게 물어보세요.</h1>
        <p id="greeting"></p>
        <button id="start" class="primary">음성 상담 시작</button>
        <p class="small">AI가 답변합니다. 마이크 사용 허용이 필요합니다.</p>
      </section>
      <div id="messages" role="log" aria-live="polite"></div>
      <p id="error" role="alert"></p>
    </main>
    <section id="controls" hidden>
      <span id="clock"></span><button id="mute">마이크 끄기</button
      ><button id="end">상담 종료</button>
    </section>
    <footer>
      <form id="text-form">
        <input
          id="text"
          aria-label="질문"
          maxlength="4000"
          placeholder="글로 질문해도 좋아요"
          required
        /><button type="submit" aria-label="질문 보내기">보내기</button>
      </form>
      <button id="lead-toggle" class="text-button">
        담당자에게 문의 남기기
      </button>
      <form id="lead-form" hidden>
        <label>이름<input name="name" required maxlength="100" /></label
        ><label
          >연락처<input
            name="contact"
            required
            maxlength="200"
            placeholder="이메일 또는 전화번호" /></label
        ><label
          >문의 내용<textarea
            name="message"
            maxlength="2000"
            rows="2"
          ></textarea></label
        ><label class="consent"
          ><input name="consent" type="checkbox" required />상담 답변을 위해
          이름·연락처·문의 내용을 이 홈페이지의 상담 제공자에게 전달하고 30일간
          보관하는 데 동의합니다.</label
        ><button type="submit" class="primary">문의 접수</button>
      </form>
    </footer>
    <script type="module" src="/frame.js"></script>
  </body>
</html>
